# Builds the images a pull request changes, pushes them to GHCR tagged with the commit SHA, and
# commits the new tags into deploy/values.yaml on the pull request's own branch: the tag lands with
# the edit that changed the app, staging the deployment (O14, O160). Merging deploys it once the
# owner syncs in Argo (BxMesh is always manual, O14). It never pushes to main.
#
# GitHub-hosted runners: this repo is public (T13). A fork's pull request builds without pushing
# or committing anything (its token is read-only).
name: build

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # the tag commit on the pull request's branch
      packages: write   # ghcr.io/bxmesh/...
    env:
      PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      IMAGE_PREFIX: ghcr.io/bxmesh/bxmesh.net
    steps:
      # The branch itself, not the merge commit: each image is built from the commit it's tagged
      # with, and the tag commit goes on top of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # An image is built when its folder changed on this pull request, or when deploy/values.yaml
      # has no tag for it yet. Pull requests that touch only deploy/ build nothing.
      - name: What to build
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for image in site observers; do
            tag=$(yq ".${image}.image.tag" deploy/values.yaml)
            if [ -z "$tag" ] || [ "$tag" = null ] || ! git diff --quiet "$BASE"...HEAD -- "$image/"; then
              echo "$image=true" >> "$GITHUB_OUTPUT"; echo "build $image"
            else
              echo "$image=false" >> "$GITHUB_OUTPUT"; echo "skip $image: unchanged, tag $tag"
            fi
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        if: steps.plan.outputs.site == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: site
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}/site:${{ steps.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}

      - name: Build observers
        if: steps.plan.outputs.observers == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: observers
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}/observers:${{ steps.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}

      - name: Stage the new tags in deploy/values.yaml
        if: env.PUBLISH == 'true' && contains(steps.plan.outputs.*, 'true')
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BUILT: ${{ toJSON(steps.plan.outputs) }}
        run: |
          set -eu
          built=""
          for image in site observers; do
            if [ "$(echo "$BUILT" | jq -r --arg i "$image" '.[$i]')" = true ]; then
              yq -i ".${image}.image.tag = strenv(SHA)" deploy/values.yaml
              built="$built $image"
            fi
          done
          git diff --quiet && { echo "nothing to stage"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "deploy:${built} at ${SHA:0:7}" deploy/values.yaml
          git push origin "HEAD:${HEAD_REF}"
