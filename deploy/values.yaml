# bxmesh.net, in the namespace dmz-bxmesh: the static site, and the observers app on the site's
# own paths /join and /admin (O126). Settings map cluster-01's dmz/services.yml (bxmesh and
# observers) one to one.

# The static site: nginx, 2-4 pods.
site:
  image:
    repository: ghcr.io/bxmesh/bxmesh.net/site
    tag: "9ad46cfa29c317c84ce88db76d6c080a80c90311"  # CI writes the commit SHA here, on the pull request that changed site/ (O14)
  # Autoscaling (spec: Scaling): min and max, cpu_target 0.6 as 60 % of the CPU request, and
  # down_after as the scale-down window. Scaling up is immediate.
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    cpuTargetPercent: 60
    scaleDownWindowSeconds: 300
  # cores: 1 and memory: 128 in services.yml. The CPU request is the allowance the CPU target is
  # measured against. Memory requested from its use on cluster-02 (2-3 November 2026, 16.5 h:
  # p95 36 MiB, max 45 MiB); the limit stays at services.yml's 128.
  resources:
    requests:
      cpu: "1"
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 128Mi

# The backbone list on /repeaters/ (backbone/backbone.py), beside nginx in each site pod.
backbone:
  image:
    repository: ghcr.io/bxmesh/bxmesh.net/backbone
    tag: "9ad46cfa29c317c84ce88db76d6c080a80c90311"  # CI writes the commit SHA here, on the pull request that changed backbone/ (O14)
  corescopeUrl: https://corescope.bxmesh.net
  intervalSeconds: 600
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# The observers app: apply for an MQTT login (/join), approvals (/admin, behind Cloudflare Access).
# Exactly one pod, never two at once: one SQLite file and one poller. Off on the dev site and the
# previews (values-dev.yaml, values-preview.yaml): they're the website only (O282), so their
# secrets and backups are left out too.
observers:
  enabled: true
  image:
    repository: ghcr.io/bxmesh/bxmesh.net/observers
    tag: "b67142c1d9ae193f17db45ad41ace3876a375ca1"  # CI writes the commit SHA here, on the pull request that changed observers/ (O14)
  # cores: 1 and memory: 256 in services.yml, kept as the limits. Memory requested from its use on
  # cluster-02 (2-3 November 2026, 16.5 h: p95 83 MiB, max 84 MiB).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # Non-secret settings (services.yml's env), now on bxmesh.net's own paths.
  env:
    # EMQX's REST API, in CoreScope's namespace (corescope.bxmesh.net's chart, Service emqx).
    # Reaching it is the approved path from this namespace to the broker's API (O127).
    EMQX_API: http://emqx.dmz-corescope.svc.cluster.local:18083
    PUBLIC_URL: https://bxmesh.net
    MQTT_PUBLIC_HOST: mqtt.bxmesh.net
    CORESCOPE_URL: https://corescope.bxmesh.net
    SETUP_URL: https://bxmesh.net/connect/
    DISCORD_URL: https://discord.gg/uurr3UyK2n  # Western NSW MeshCore
    ADMIN_EMAILS: josh@zindello.com.au
    ACCESS_TEAM: zindello.cloudflareaccess.com
    # The audience tag of the Access app in front of bxmesh.net/admin: bxmesh/terraform's
    # `admin` app (its output admin_access_aud), made new for this path rather than moved from
    # cluster-01's observers.bxmesh.net/admin, so its tag is new too. Not a secret: it's in every
    # Access token.
    ACCESS_AUD: 268c32c49618a4eb381a81451064c6526b250ca387a775d8fb7e5e2b3f7edc3f
    TURNSTILE_SITEKEY: 0x4AAAAAAFjcsp1S1dOQEz1J
    # Cloudflare Email Sending's SMTP; bxmesh.net is onboarded for sending.
    SMTP_HOST: smtp.mx.cloudflare.net
    SMTP_PORT: "465"
    SMTP_USER: api_token
    MAIL_FROM: BxMesh observers <observers@bxmesh.net>
    REPLY_TO: observers@bxmesh.net
    NOTIFY_TO: observers@bxmesh.net  # a note for each new application
  # observers.db: applications, decisions, connection history. New and empty; the restore Job
  # copies cluster-01's dmz/data/observers into it (O163). Mounted at /srv/data.
  data:
    storageClassName: ceph-block
    size: 1Gi  # placeholder: the owner sets it from the measured folder size
    keep: true # Argo never prunes or deletes the volume

# false until the restore Job has copied observers-data back (O163): the observers Deployment
# stays at 0 replicas. The owner sets it to true by pull request once the restore has succeeded.
# The site has no data and doesn't wait.
restored: true

# The routes, on BxMesh's own gateway (O73).
route:
  gateway: bxmesh
  gatewayNamespace: platform-gateways
  sectionName: http
  hostnames: [bxmesh.net, www.bxmesh.net]
  # /admin only on this one: the Access app and the app's same-origin check are for it alone.
  adminHostname: bxmesh.net
  # X-Robots-Tag: noindex on every response, so search engines leave a copy alone (dev, previews).
  noindex: false

# A preview's name, pr-<number>, set by its ApplicationSet (cluster-platform, O282): each preview's
# objects and selectors carry it, so they share one namespace. Empty here and on dev.
instance: ""

# Probes, from cluster-01's health checks (the edges' and dmz-controller's).
probes:
  readiness:  # the edge health check: every 5 s, 2 s timeout
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:   # dmz-controller's defaults: every 30 s, 5 s timeout, 6 failures
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

# Secrets, from OpenBao through External Secrets (spec: Security, secrets and access).
secrets:
  openbao:
    server: http://openbao-active.openbao.svc:8200
    path: secret
    authMountPath: kubernetes
  refreshInterval: 1h

# Backups (R15; cluster-docs spec/design.md, Storage: Backups; O265, O269, O270): each volume
# below, nightly, to the one R2 bucket by VolSync's restic mover (cluster-platform volsync/), and
# restored into a scratch volume and checked on the first Sunday of each month
# (templates/backups.yaml). The bucket, its token and restic's password come from OpenBao,
# secret/dmz-bxmesh/backups (cluster-terraform's stacks/cloudflare), never from here.
#
# The schedules are in UTC: VolSync's controller has no time-zone data (its 0.17.0 image), so it
# can't take a CRON_TZ= prefix. The volume backups are staggered over 16:00-16:45 UTC, which is
# 03:00-03:45 in Sydney in summer time (AEDT) and an hour earlier, 02:00-02:45, in winter (AEST).
backups:
  volumes:
    # observers.db (observers.data), as of one instant: a clone.
    - claim: observers-data
      copyMethod: Clone
      uid: 10001
      gid: 10001
      fsGroup: 10001
      schedule: "26 16 * * *"
      scratch: {storageClassName: ceph-block, size: 1Gi}
  # restic's cache, a claim VolSync makes per volume. Set here for every volume: left out, VolSync
  # gives it the source's access mode in the default class, and a CephFS volume's ReadWriteMany
  # on ceph-block is refused, so the cache never binds and the mover never starts (as happened to
  # zindello.com.au's first backup). The cache only speeds up the next run.
  cache:
    storageClassName: ceph-block
    accessModes: [ReadWriteOnce]
    capacity: 1Gi
  # The movers' limits (as cluster-platform #104 for Prometheus'): restic sizes its workers by
  # the CPUs it sees, and with no CPU limit it sees the whole node (48 on the R430) and was
  # OOM-killed at 1Gi. Go takes its GOMAXPROCS from the CPU limit, so 2 CPUs mean 2 workers. Every
  # volume here is well under 100 GB and 10,000 files, so 2Gi is ample. No requests, as before.
  moverResources:
    limits: {cpu: "2", memory: 2Gi}
  # Every volume: 30 daily copies (R15), pruned weekly.
  retain:
    daily: 30
  pruneIntervalDays: 7
  restoreTest:
    # The first Sunday of each month at 05:00 in Sydney (O270). The CronJob starts every Sunday
    # and tests only on the first (templates/backups.yaml).
    schedule: "0 5 * * 0"
    timeZone: Australia/Sydney
    # The newest snapshot must be from the night before.
    maxAgeHours: 26
    # VolSync's own image, the release cluster-platform installs (volsync/), pinned by tag and
    # digest (quay.io, read 4 November 2026): the same restic as the movers.
    image: quay.io/backube/volsync:0.17.0@sha256:bbc884d4fa108534260025bf1255a1010ebb6bb8dac9ba4f4a77f437ca7f8fbd
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      # The same CPU limit as the movers: it bounds restic's workers.
      limits: {cpu: "2", memory: 2Gi}
