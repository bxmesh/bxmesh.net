{{- $s := .Values.secrets }}
# External Secrets signs in to OpenBao as this service account, with the role named after the
# namespace, which may read only secret/dmz-bxmesh/... and secret/shared/bxmesh-broker/... (O72,
# O127; cluster-terraform's stacks/openbao/paths.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $s.openbao.server | quote }}
      path: {{ $s.openbao.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ $s.openbao.authMountPath | quote }}
          role: {{ .Release.Namespace | quote }}
          serviceAccountRef:
            name: external-secrets
---
# The observers app's secrets, as the files it reads in /srv/secrets: its SMTP password and
# Turnstile secret from its own path, and the broker's API key (key:secret) from the path it
# shares with CoreScope's namespace (O127).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observers
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: observers
  data:
    - secretKey: smtp_password
      remoteRef:
        key: {{ .Release.Namespace }}/observers
        property: smtp_password
    - secretKey: turnstile_secret
      remoteRef:
        key: {{ .Release.Namespace }}/observers
        property: turnstile_secret
    - secretKey: emqx_api_key
      remoteRef:
        key: shared/bxmesh-broker/emqx
        property: api_key
