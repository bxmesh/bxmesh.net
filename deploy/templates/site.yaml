# The static site: nginx (NGINX's unprivileged image, uid 101, port 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site{{ include "bxmesh.suffix" . }}
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: site
    {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 4 }}{{- end }}
spec:
  # No replicas: the autoscaler owns the count (2 to 4).
  # A new pod is ready before an old one goes, so a rollout never drops below the count. The site
  # has no volume, so two versions side by side are fine.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: site
      {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 6 }}{{- end }}
  template:
    metadata:
      labels:
        {{- include "bxmesh.labels" . | nindent 8 }}
        app.kubernetes.io/name: site
        {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      # Stopping a pod without failing a request. A pod being stopped (a rollout, a drain) leaves
      # the Service at once, but the gateway's Envoys hear of it a moment later and can still send
      # it requests. So nginx sleeps 10 s first (preStop, Kubernetes' own sleep action) while the
      # pod still serves, and only then gets SIGQUIT (the image's STOPSIGNAL), its graceful stop,
      # which finishes the requests in flight. 30 s covers the sleep, the gateway's 15-second
      # request limit and a margin.
      terminationGracePeriodSeconds: 30
      # Each pod on a different node, required: one node going down never takes the site with it.
      # pod-template-hash counts only the current ReplicaSet's pods, so a rollout isn't held up by
      # the old ones. Only the nodes it may run on count (nodeTaintsPolicy, nodeAffinityPolicy:
      # Honor): a node it doesn't tolerate isn't an empty node the skew is measured against, which
      # would hold the autoscaler's third replica and beyond Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: site
              {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 14 }}{{- end }}
          matchLabelKeys: [pod-template-hash]
      securityContext:
        {{- include "bxmesh.podSecurity" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "bxmesh.image" .Values.site.image }}
          securityContext:
            {{- include "bxmesh.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Serve on while the gateway catches up with the pod's removal; only then stop.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.site.resources | nindent 12 }}
          volumeMounts:
            - name: tmp  # nginx's pid and temp files (the unprivileged image keeps them in /tmp)
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: site{{ include "bxmesh.suffix" . }}
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: site
    {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 4 }}{{- end }}
spec:
  selector:
    app.kubernetes.io/name: site
    {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 4 }}{{- end }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# A drain never takes more than one site pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: site{{ include "bxmesh.suffix" . }}
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: site
    {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 4 }}{{- end }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: site
      {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 6 }}{{- end }}
---
{{- $a := .Values.site.autoscaling }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: site{{ include "bxmesh.suffix" . }}
  labels:
    {{- include "bxmesh.labels" . | nindent 4 }}
    app.kubernetes.io/name: site
    {{- with include "bxmesh.instanceLabel" . }}{{ . | nindent 4 }}{{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: site{{ include "bxmesh.suffix" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.cpuTargetPercent }}
  behavior:
    # Up straight away, to as many as the load calls for (cluster-01's dmz-controller).
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: {{ $a.maxReplicas }}
          periodSeconds: 15
    # Down only after the load has stayed low for the window (scale.down_after).
    scaleDown:
      stabilizationWindowSeconds: {{ $a.scaleDownWindowSeconds }}
