server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relative redirects: behind the Cloudflare Tunnel the upstream is plain
  # http, so an absolute one would point at http://<host>/.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Fonts never change under the same name.
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
}
