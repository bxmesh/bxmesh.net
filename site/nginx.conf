server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relative redirects: behind the Cloudflare Tunnel the upstream is plain
  # http, so an absolute one would point at http://<host>/.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Server-side includes: /repeaters/ includes the backbone list (below).
  location / {
    ssi on;
    try_files $uri $uri/ =404;
  }

  # The backbone list, which the backbone container beside nginx writes every 10 minutes
  # (backbone/backbone.py). Only for includes, never served on its own. Until the first one,
  # or without the container (the image checked on its own in CI), the include fails and the
  # page shows its own fallback list.
  location /backbone/ {
    internal;
    alias /data/;
    log_not_found off;
  }

  # Fonts never change under the same name.
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
}
